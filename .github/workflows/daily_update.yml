name: Actualizacion Diaria de Datos

on:
  schedule:
    # Se ejecuta todos los dias a las 07:00 AM UTC (8:00 AM hora de Espana)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic cuando quieras

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar actualizacion diaria
        run: python daily_update.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff-index --quiet HEAD || git commit -m "Auto-update datos diarios"
          git push
